[package]
name = "locaryn-plugin-dictaphone"
version = "2.5.0-beta.3"
edition = "2021"
description = "Official Locaryn Extension: Voice Dictation & Speech-to-Text (Whisper, live Nemotron 3.5 ASR)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-dictaphone-mcp"
path = "src/bin/dictaphone_mcp.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
