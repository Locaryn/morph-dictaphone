[package]
name = "locaryn-plugin-dictaphone"
version = "2.0.0"
edition = "2021"
description = "Official Locaryn Extension: Voice Dictation & Speech-to-Text (Whisper)"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-dictaphone-mcp"
path = "src/bin/dictaphone_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
